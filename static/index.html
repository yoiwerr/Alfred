<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阿福 AFU — AI 协作管家</title>
<link rel="icon" href="source/alfred.jpg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">

  <!-- ═══════════ 顶部导航栏 ═══════════ -->
  <header class="topbar">
    <div class="topbar-left">
      <div class="topbar-brand">
        <span class="topbar-name">阿福 Alfred</span>
        <span class="topbar-subtitle">AI 协作管家</span>
      </div>
      <span class="topbar-status">
        <span class="status-dot"></span>
        <span class="status-text">随时为您整理思路</span>
      </span>
    </div>
    <div class="topbar-right">
      <button class="btn-outline" id="btnImport" onclick="openModal('modalImport')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <span>读入项目记忆</span>
      </button>
      <button class="btn-accent" id="btnDownload" onclick="openModal('modalDownload')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span>下载记忆摘要</span>
      </button>
    </div>
  </header>

  <!-- ═══════════ 对话区域 ═══════════ -->
  <main class="chat-area" id="chatArea">

    <!-- 空状态 -->
    <div class="empty-state" id="emptyState">
      <div class="empty-avatar">
        <img src="source/alfred.jpg" alt="阿福">
      </div>
      <h2 class="empty-greeting">晚上好，我是阿福。</h2>
      <p class="empty-hint">告诉我您现在想完成什么，我会陪您把思路整理清楚。</p>
      <div class="example-questions">
        <button class="example-btn" onclick="useExample('我有一个项目想法，但不知道从哪里开始')">我有一个项目想法，但不知道从哪里开始</button>
        <button class="example-btn" onclick="useExample('帮我整理一份交给 Claude 的任务说明')">帮我整理一份交给 Claude 的任务说明</button>
        <button class="example-btn" onclick="useExample('继续上一次项目工作')">继续上一次项目工作</button>
      </div>
    </div>

    <!-- 消息列表 -->
    <div class="messages" id="messages" style="display:none;"></div>

  </main>

  <!-- ═══════════ 输入区域 ═══════════ -->
  <footer class="composer">
    <div class="composer-box">
      <button class="composer-attach" title="附件（暂未开放）">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      </button>
      <textarea id="userInput"
        placeholder="告诉阿福，您现在想完成什么……"
        rows="1"
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"></textarea>
      <button class="composer-send" id="sendBtn" onclick="sendMessage()" title="发送">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
      </button>
    </div>
    <p class="composer-hint">阿福会先理解您的目标，再陪您整理下一步。</p>
  </footer>

</div>

<!-- ═══════════ 弹窗：读入项目记忆 ═══════════ -->
<div class="modal-overlay" id="modalImport" onclick="closeModalBg(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <h3 class="modal-title">读入项目记忆</h3>
    <p class="modal-body">后续将支持导入 Markdown 格式的项目记忆摘要。</p>
    <button class="modal-btn" onclick="closeModal('modalImport')">知道了</button>
  </div>
</div>

<!-- ═══════════ 弹窗：下载记忆摘要 ═══════════ -->
<div class="modal-overlay" id="modalDownload" onclick="closeModalBg(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <h3 class="modal-title">下载记忆摘要</h3>
    <p class="modal-body">后续将根据当前对话生成并下载 Markdown 项目记忆摘要。</p>
    <button class="modal-btn" onclick="closeModal('modalDownload')">知道了</button>
  </div>
</div>

<script src="js/chat.js"></script>
</body>
</html>
